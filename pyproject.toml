[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "animetta"
version = "0.1.0"
description = "AI virtual companion / VTuber framework with Live2D avatar support"
requires-python = ">=3.13"
dependencies = [
    "starlette==0.52.1",
    "uvicorn[standard]==0.42.0",
    "python-socketio==5.16.1",
    "python-engineio==4.13.1",
    "websockets==16.0",
    "pydantic==2.12.5",
    "pyyaml==6.0.3",
    "python-dotenv==1.2.2",
    "loguru==0.7.3",
    "redis[hiredis]==7.4.1",
    "tzdata==2026.2; sys_platform == 'win32'",
    "langgraph==1.1.3",
    "langgraph-checkpoint==4.2.0",
    "langgraph-checkpoint-redis==0.5.1",
    "langchain==1.2.13",
    "langchain-core==1.2.20",
    "langchain-openai==1.1.11",
    "langchain-community==0.4.1",
    "mcp==1.26.0",
    "numpy==2.4.3",
    "aiosqlite==0.22.1",
    "opencc-python-reimplemented==0.1.7",
    "jieba==0.42.1",
    "pyjwt==2.10.1",
    "jinja2==3.1.6",
    "httpx[socks]==0.28.1",
    "prometheus-client==0.25.0",
    "opentelemetry-api==1.40.0",
    "opentelemetry-sdk==1.40.0",
    "bilibili-api-python==17.4.1",
]

[dependency-groups]
dev = [
    "ruff==0.15.21",
    "mypy==1.20.2",
    "vulture==2.16",
    "pre-commit==4.6.0",
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.1.0",
    "pytest-xdist==3.8.0",
    "pytest-timeout==2.4.0",
    "websocket-client==1.9.0",
    "pydub==0.25.1",
    "audioop-lts==0.2.2; python_version >= '3.13'",
    "aiohttp==3.13.3",
    "psutil==7.2.2",
    "uv==0.11.19",
]

[tool.uv]
required-version = "==0.11.19"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "asyncio: mark test as asyncio",
    "integration: mark as integration test (requires external services)",
    "slow: mark test as slow and potentially hanging (skipped in default CI run)",
    "config_unit: deterministic canonical manifest and EffectiveConfig tests",
    "provider_contract: deterministic remote provider contract tests",
    "real_smoke: real DeepSeek and MiMo validation requiring credentials",
    "production_fault: production-only fault injection and recovery rehearsal",
    "production_soak: ten-minute production acceptance requiring full services",
]
addopts = "-v --tb=short -n 8 -m \"not slow and not integration and not real_smoke and not production_fault and not production_soak\" --timeout=30 --timeout-method=thread"

[tool.coverage.run]
source = ["src/animetta"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
show_missing = true
fail_under = 0

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "SIM", "ANN001", "ANN201"]
ignore = ["E402", "E501", "UP007"]  # E402: lazy imports intentional, E501: Chinese text, UP007: dynamic Union[tuple()] needed

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use PascalCase for fixtures/class refs and don't follow strict naming
"tests/**/*.py" = ["ANN001", "ANN201", "N803", "N806", "N815", "N802", "N805", "N817", "N811"]

[tool.ruff.format]
line-ending = "lf"
quote-style = "double"

[tool.mypy]
python_version = "3.13"
explicit_package_bases = true
strict = false
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false
disallow_any_unimported = false
no_implicit_optional = false
strict_optional = false

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.vulture]
min_confidence = 80
paths = ["tooling", "scripts", "evaluations", "src/animetta", "src/animetta_qwen_tts"]
